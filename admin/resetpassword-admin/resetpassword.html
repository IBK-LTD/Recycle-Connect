<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recycle Connect--Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../forgottenpassword/style.css" />
  </head>
  <body>
    <div class="forgot-page">
      <div class="forgot-card">
        <h2>Reset your password</h2>
        <p class="form-subheading">
          Paste the reset token you received and choose a new password.
        </p>

        <form id="resetform">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="admin@recycleconnect.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="token">Reset Token</label>
            <input
              type="text"
              id="token"
              placeholder="Paste your reset token here"
              required
            />
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input
              type="password"
              id="newPassword"
              placeholder="Enter new password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Re-enter new password"
              required
            />
          </div>

          <button type="submit" class="btn-signin">Reset Password</button>
        </form>

        <div id="formMessage" class="form-message"></div>

        <a href="../index.html" class="back-link">&larr; Back to sign in</a>
      </div>
    </div>

    <script src="../resetpassword-admin/script.js"></script>
  </body>
</html>
