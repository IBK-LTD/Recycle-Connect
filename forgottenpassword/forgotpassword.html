<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recycle Connect--Forgot Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../forgottenpassword/style.css" />
  </head>
  <body>
    <div class="forgot-page">
      <div class="forgot-card">
        <h2>Forgot your password?</h2>
        <p class="form-subheading">
          Enter the email linked to your account and we'll help you reset your
          password.
        </p>

        <form id="forgotform">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="admin@recycleconnect.com"
              required
            />
          </div>

          <button type="submit" class="btn-signin">Send Reset Link</button>
        </form>

        <div id="formMessage" class="form-message"></div>

        <div id="devTokenBox" class="dev-token-box" style="display: none">
          <p><strong>Dev mode — reset token:</strong></p>
          <code id="devTokenValue"></code>
          <button id="copyTokenBtn" type="button" class="btn-copy">
            Copy token
          </button>
          <a
            href="../resetpassword-admin/resetpassword.html"
            class="proceed-link"
            >Continue to reset password &rarr;</a
          >
        </div>

        <a href="../login page/login.html" class="back-link"
          >&larr; Back to sign in</a
        >
      </div>
    </div>

    <script src="../forgottenpassword/script.js"></script>
  </body>
</html>
