<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../components/shared.css">

<link rel="stylesheet" href="../settings/style.css">
</head>
<body  data-page-title="Settings">
    <div id="sidebar-placeholder"></div>

  <div class="main-content">
    <div id="topbar-placeholder"></div>

    <main>
        <section class="settings-content">
            <div class="profile-card">
                <div class="profile-card-header">
                    <h2>Profile Information</h2>
                    <p>Update your personal information and profile details.</p>
                </div>

                <div class="profile-card-body">
                    <div class="profile-photo">
                        <img src="../settings/icon/set.png" alt="profile-photo">
                        <button class="change-photo-btn">
                            <img src="../settings/icon/Vector (2).svg" alt="arrow">
                        </button>
                        <p>Change Photo <span class="change-photo-hint">JPG, PNG or GIF Max size of 2MB</span></p> 
                    </div>

                    <div></div>


                </div>
            </div>
        </section>
    </main>
    </div>
    
    <script src="../components/include.js"></script>
</body>
</html>
