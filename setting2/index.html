<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings_2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="../components/firstbar.html">
    <link rel="stylesheet" href="../component2/share.css">

    <link rel="stylesheet" href="../setting2/style.css">
</head>
<body>
    <div id="sidebar-placeholder"></div>

  <div class="main-content">
    <div id="firstbar-placeholder"></div>
    <main>
     <section class="settings-content">
      <div class="settings-links">
       <a href="Recycle-Connect\dashboard">Dashboard</a>
       <img src="../assets/logo2/greater-than.svg" alt="greater than" class="greater-than">
       <a href="Recycle-Connect\setting2">Settings</a>
      </div>
      <div class="settings-header">
        <h2>Settings</h2>
        <div class="settings-button">
          <button class="cancel">Cancel</button>
          <button class="save-changes">Save Changes</button>
        </div>
        </div>
     </section> 
     <section class="facility" >
     <div class="facility-profile">
      <div class="facility-logo">
        <img src="../assets/logo2/factory(1).svg" class="factory logo" alt="facility logo">
        <h2 class="facility-header" >Facility Profile </h2>
      </div>
    
      <div class="facility-form">
        <datal class="facility-group 1">
          <label for="facility-name">Company Name</label>
          <input type="text" id="facility-name" value="GreenTech Solutions" readonly>
        </datal>
        <datal class="facility-group 2">
          <label for="facility-id">Company ID</label>
          <input type="text" id="facility-id" value="CM-IND-402-B" readonly>
        </datal>
        <datal class="facility-group location3">
          <label for="facility-location">Location</label>
          <img src="../assets/logo2/map-pin.svg" alt="map pin">          
          <input class="location" type="text" id="facility-location"  value="Isolo Industrial Estate, Isolo, Lagos" readonly>
        </datal>
        <datal class="facility-group 4">
          <label for="facility-contact">Primary Contact</label>
          <input type="text" id="facility-contact" value="Tolu Kingsley" readonly>
        </datal>
        <datal class="facility-group 5">
          <label for="facility-email"> Contact Email</label>
          <input type="text" id="facility-email" value="tolu@recycleconnect.com" readonly>
      </div>
     </div>
     <section class="security-section">
      <div class="security">
        <div class="security-logo">
        <img src="../assets/logo2/shield-checkered.svg" alt="security logo" class="security-logo">
        <h2 class="security-header">Security</h2>
        </div>
        <div class="athentication">
        <div class="security-athentication">
          <h3>Two Factor Auth</h3>
          <p>SMS or Authenticator app</p>
          </div>
          <div class="security-button">
          <label class="switch">
          <input class="security-button" type="checkbox"></input>
          <span class="slider"></span>
          </label>
          </div>
        </div>
        <div class="password">
          <button class="change-password">Change Password</button>
          <img src="../assets/logo2/arrow-right.svg" alt="arrow right" class="arrow-right">
          </div>
      </div>
     
     <div class="alarms">
      <div class="alarm-logo">
        <img src="../assets/logo2/bell-ringing.svg" alt="bell">
        <h3>Alerts</h3>
      </div>
      <div class="alarm-info">
        <div class="materials-info">
      <p>Materials Alerts</p>
      <label class="materials">
        <input type="checkbox" class="materials-button">
        <span class="materials-slider"></span>
      </label>
      </div>
      <div class="reports-info">
        <p>Weekly Sustainability Report</p>
        <label class=reports>
          <input type="checkbox" class="reports-button">
          <span class="reports-slider"></span>
        </label>
      </div>
      </div>
      </div>
      </section>
     </section>


    </main>
    </div>


    <script src="../setting2/include.js"></script>
</body>
</html>
